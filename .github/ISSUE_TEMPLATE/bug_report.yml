name: 🐛 Bug
description: Reportar um comportamento incorreto no compilador ou na documentação
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar um problema! Preencha as informações abaixo com o máximo de detalhe possível.

  - type: dropdown
    id: etapa
    attributes:
      label: Etapa do compilador afetada
      description: Em qual etapa do pipeline o bug ocorre?
      options:
        - Análise léxica (Flex)
        - Análise sintática (Bison)
        - AST
        - Análise semântica (tipos/escopo)
        - Geração de código intermediário
        - Geração de código final (TypeScript)
        - Documentação (GitPage)
        - Ambiente/Build
        - Outro
    validations:
      required: true

  - type: textarea
    id: descricao
    attributes:
      label: Descrição do bug
      description: Explique de forma clara e concisa o que está acontecendo.
      placeholder: Descreva o comportamento incorreto observado.
    validations:
      required: true

  - type: textarea
    id: reproducao
    attributes:
      label: Passos para reproduzir
      description: Como podemos reproduzir o problema? Se possível, inclua um trecho de código-fonte Mini-C.
      placeholder: |
        1. Compile o seguinte código Mini-C: ...
        2. Execute '...'
        3. Observe o erro '...'
      render: shell
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
      description: O que deveria acontecer em vez disso?
    validations:
      required: true

  - type: textarea
    id: evidencias
    attributes:
      label: Logs, mensagens de erro ou prints
      description: Cole aqui saídas do terminal, stack traces ou screenshots relevantes.
      render: shell
    validations:
      required: false

  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: SO, versão do Flex/Bison, versão do compilador C/C++, etc.
      placeholder: "Ex.: Fedora 44, flex 2.6.4, bison 3.8.2, gcc 14"
    validations:
      required: false

  - type: dropdown
    id: severidade
    attributes:
      label: Severidade
      options:
        - Crítica (bloqueia o build ou uso do compilador)
        - Alta (funcionalidade importante quebrada)
        - Média (funcionalidade secundária afetada)
        - Baixa (cosmético/documentação)
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Qualquer outra informação relevante (sprint em andamento, PR relacionado, etc.)
    validations:
      required: false
